name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # After initializing, commit pnpm-lock.yaml and switch to --frozen-lockfile.
      - run: pnpm install
      - run: pnpm run test:docs
